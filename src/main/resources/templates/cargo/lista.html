<!doctype html>
<html
  lang="pt"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <section class="layout-content" layout:fragment="corpo">
      <nav class="navbar navbar-expand-md bg-light">
        <div class="collapse navbar-collapse" id="navbarsExampleDefault">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <i class="bi bi-caret-right-fill"></i>
              <span>Lista de Cargos</span>
            </li>
          </ul>
        </div>
        <a class="btn btn-primary btn-md" th:href="@{/cargos/cadastrar}" role="button">
          <span class="bi bi-plus-lg" title="Cadastro" aria-hidden="true"></span>
          <span>Novo Cargo</span>
        </a>
      </nav>

      <div class="container" id="listagem">
        <div th:replace="~{fragments/alert :: alerta}"></div>

        <div class="table-responsive">
          <table class="table table-striped table-hover table-sm">
            <thead>
              <tr>
                <th>#</th>
                <th>Cargo</th>
                <th>Departamento</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${cargos}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.nome}">Auxiliar Contábil</td>
                <td th:text="${c.departamento?.nome}">Contabilidade</td>
                <td colspan="2">
                  <a
                    class="btn btn-info btn-sm"
                    th:href="@{/cargos/editar/{id}(id=${c.id})}"
                    role="button"
                  >
                    <span class="bi bi-pencil" title="Editar" aria-hidden="true"></span>
                  </a>
                  <!-- Só permite excluir se o cargo não tiver funcionários -->
                  <a
                    th:if="${#lists.isEmpty(c.funcionarios)}"
                    class="btn btn-danger btn-sm"
                    th:href="@{/cargos/excluir/{id}(id=${c.id})}"
                    role="button"
                    onclick="return confirm('Confirma a exclusão do cargo?');"
                  >
                    <span class="bi bi-trash3" title="Excluir" aria-hidden="true"></span>
                  </a>
                  <button
                    th:unless="${#lists.isEmpty(c.funcionarios)}"
                    type="button"
                    class="btn btn-secondary btn-sm"
                    disabled
                  >
                    <span
                      class="bi bi-x-circle"
                      title="Exclusão desabilitada: possui funcionários"
                      aria-hidden="true"
                    ></span>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
