<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Mensagens enviadas pelo controller via RedirectAttributes -->
    <div th:fragment="alerta">
      <div
        class="alert alert-success alert-dismissible fade show"
        role="alert"
        th:if="${success != null}"
      >
        <span th:text="${success}">Operação realizada com sucesso.</span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Fechar"
        ></button>
      </div>
      <div
        class="alert alert-danger alert-dismissible fade show"
        role="alert"
        th:if="${fail != null}"
      >
        <span th:text="${fail}">Falha na operação.</span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Fechar"
        ></button>
      </div>
    </div>
  </body>
</html>
