<!doctype html>
<html
  lang="pt"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <section class="layout-content" layout:fragment="corpo">
      <nav class="navbar navbar-expand-md bg-light">
        <div class="collapse navbar-collapse" id="navbarsExampleDefault">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <i class="bi bi-caret-right-fill"></i>
              <span>Lista de Funcionários</span>
            </li>
          </ul>
          <a
            class="btn btn-primary btn-md ms-auto"
            th:href="@{/funcionarios/cadastrar}"
            role="button"
          >
            <span class="bi bi-plus-lg" title="Cadastro" aria-hidden="true"></span>
            <span>Cadastrar Funcionários</span>
          </a>
        </div>
      </nav>

      <div class="container">
        <div th:replace="~{fragments/alert :: alerta}"></div>

        <p>
          <i class="bi bi-search"></i><span></span>
          <button
            class="btn btn-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseNome"
            aria-controls="collapseNome"
          >
            Nome
          </button>
          <button
            class="btn btn-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseCargo"
            aria-controls="collapseCargo"
          >
            Cargo
          </button>
          <button
            class="btn btn-primary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseData"
            aria-controls="collapseData"
          >
            Datas
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/funcionarios/listar}">
            Todos
          </a>
        </p>
        <div class="row">
          <div class="col">
            <div class="collapse" id="collapseNome">
              <nav class="navbar navbar-light bg-light">
                <form class="d-flex" method="GET" th:action="@{/funcionarios/buscar/nome}">
                  <input
                    class="form-control me-2"
                    type="search"
                    placeholder="nome"
                    aria-label="Search"
                    name="nome"
                  />
                  <button class="btn btn-outline-success">Buscar</button>
                </form>
              </nav>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <div class="collapse" id="collapseCargo">
              <nav class="navbar navbar-light bg-light">
                <form class="d-flex" method="GET" th:action="@{/funcionarios/buscar/cargo}">
                  <select class="form-control me-2" name="cargo" aria-label="Search">
                    <option value="">Cargo</option>
                    <option
                      th:each="c : ${cargos}"
                      th:value="${c.id}"
                      th:text="${c.nome}"
                    >
                      Auxiliar Contábil
                    </option>
                  </select>
                  <button class="btn btn-outline-success">Buscar</button>
                </form>
              </nav>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <div class="collapse" id="collapseData">
              <nav class="navbar navbar-light bg-light">
                <form class="d-flex" method="GET" th:action="@{/funcionarios/buscar/data}">
                  <input
                    class="form-control me-2"
                    type="date"
                    aria-label="Search"
                    name="entrada"
                  />
                  <input
                    class="form-control me-2"
                    type="date"
                    aria-label="Search"
                    name="saida"
                  />
                  <button class="btn btn-outline-success">Buscar</button>
                </form>
              </nav>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover table-sm">
            <thead>
              <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Salário</th>
                <th>Departamento</th>
                <th>Cargo</th>
                <th>Endereço</th>
                <th>Data de Entrada</th>
                <th>Data de Saída</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="f : ${funcionarios}">
                <td th:text="${f.id}">1</td>
                <td th:text="${f.nome}">Jorge da Silva</td>
                <td th:text="|R$ ${{f.salario}}|">R$ 3.500,99</td>
                <td th:text="${f.cargo?.departamento?.nome}">Recursos Humanos</td>
                <td th:text="${f.cargo?.nome}">Auxiliar de RH</td>
                <td>
                  <button
                    th:if="${f.endereco != null}"
                    type="button"
                    class="btn btn-secondary btn-sm"
                    data-bs-container="body"
                    data-bs-toggle="popover"
                    data-bs-placement="top"
                    th:attr="data-bs-content=|${f.endereco.logradouro}, ${f.endereco.numero} ${f.endereco.complemento ?: ''} - ${f.endereco.bairro}, ${f.endereco.cidade} - ${f.endereco.uf} - ${f.endereco.cep}|"
                  >
                    <span class="bi bi-eye" title="Visualizar" aria-hidden="true"></span>
                  </button>
                </td>
                <td th:text="${#temporals.format(f.dataEntrada, 'dd/MM/yyyy')}">01/10/2014</td>
                <td th:text="${#temporals.format(f.dataSaida, 'dd/MM/yyyy')}"></td>
                <td colspan="2">
                  <a
                    class="btn btn-info btn-sm"
                    th:href="@{/funcionarios/editar/{id}(id=${f.id})}"
                    role="button"
                  >
                    <span class="bi bi-pencil" title="Editar" aria-hidden="true"></span>
                  </a>
                  <a
                    class="btn btn-danger btn-sm"
                    th:href="@{/funcionarios/excluir/{id}(id=${f.id})}"
                    role="button"
                    onclick="return confirm('Confirma a exclusão do funcionário?');"
                  >
                    <span class="bi bi-trash3" title="Excluir" aria-hidden="true"></span>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
