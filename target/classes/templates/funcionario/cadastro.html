<!doctype html>
<html
  lang="pt"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <section class="layout-content" layout:fragment="corpo">
      <div class="page-header">
        <nav class="navbar navbar-expand-md navbar-top bg-light">
          <div class="collapse navbar-collapse" id="navbarsExampleDefault">
            <ul class="navbar-nav">
              <li class="nav-item active">
                <i class="bi bi-caret-right-fill"></i>
                <span>Cadastrar Funcionários</span>
              </li>
            </ul>
          </div>
          <a
            class="btn btn-primary btn-md ms-auto"
            th:href="@{/funcionarios/listar}"
            role="button"
          >
            <span class="bi bi-table" title="Listar" aria-hidden="true"></span>
            <span>Listar Funcionários</span>
          </a>
        </nav>
      </div>

      <div class="container" id="cadastro">
        <div th:replace="~{fragments/alert :: alerta}"></div>

        <form
          th:action="${funcionario.id == null} ? @{/funcionarios/salvar} : @{/funcionarios/editar}"
          th:object="${funcionario}"
          method="POST"
        >
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="nome">Nome do Funcionário</label>
              <input
                type="text"
                class="form-control"
                id="nome"
                placeholder="Nome Completo"
                autofocus="autofocus"
                th:field="*{nome}"
              />
            </div>
            <div class="form-group col-md-6">
              <label for="salario">Salário Bruto</label>
              <input
                type="text"
                class="form-control"
                id="salario"
                data-mask="#.##0,00"
                data-mask-reverse="true"
                th:field="*{salario}"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="dataEntrada">Data de Entrada</label>
              <input
                type="date"
                class="form-control"
                id="dataEntrada"
                th:field="*{dataEntrada}"
              />
            </div>
            <div class="form-group col-md-6">
              <label for="dataSaida">Data de Saída</label>
              <input
                type="date"
                class="form-control"
                id="dataSaida"
                th:field="*{dataSaida}"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="cargo">Cargo</label>
              <select id="cargo" class="form-control" th:field="*{cargo}">
                <option value="">Selecione...</option>
                <option
                  th:each="c : ${cargos}"
                  th:value="${c.id}"
                  th:text="${c.nome}"
                >
                  Auxiliar Contábil
                </option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="cidade">Cidade</label>
              <input
                type="text"
                class="form-control"
                id="cidade"
                th:field="*{endereco.cidade}"
              />
            </div>
            <div class="form-group col-md-6">
              <label for="logradouro">Logradouro</label>
              <input
                type="text"
                class="form-control"
                id="logradouro"
                placeholder="logradouro sem número"
                th:field="*{endereco.logradouro}"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="numero">Número</label>
              <input
                type="text"
                class="form-control"
                id="numero"
                th:field="*{endereco.numero}"
              />
            </div>
            <div class="form-group col-md-6">
              <label for="complemento">Complemento</label>
              <input
                type="text"
                class="form-control"
                id="complemento"
                placeholder="fundos, casa, AP. 102, .."
                th:field="*{endereco.complemento}"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="bairro">Bairro</label>
              <input
                type="text"
                class="form-control"
                id="bairro"
                th:field="*{endereco.bairro}"
              />
            </div>
            <div class="form-group col-md-4">
              <label for="uf">UF</label>
              <select id="uf" class="form-control" th:field="*{endereco.uf}">
                <option value="">Selecione...</option>
                <option
                  th:each="uf : ${ufs}"
                  th:value="${uf}"
                  th:text="${uf.sigla}"
                >
                  SP
                </option>
              </select>
            </div>
            <div class="form-group col-md-2">
              <label for="cep">Cep</label>
              <input
                type="text"
                class="form-control"
                id="cep"
                data-mask="00000-000"
                th:field="*{endereco.cep}"
              />
            </div>
          </div>
          <input type="hidden" id="id" th:field="*{id}" />
          <input type="hidden" id="enderecoId" th:field="*{endereco.id}" />
          <button type="submit" class="btn btn-primary btn-sm mt-3">
            Salvar
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
